[project]
name = "knowledge-hub-plus-backend"
version = "0.1.0"
description = "Knowledge Hub Plus backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "motor>=3.6.0",
    "pymongo>=4.10.0",
    "redis>=5.2.0",
    "elasticsearch[async]>=8.17.0",
    "neo4j>=5.26.0",
    "aio-pika>=9.5.0",
    "aioboto3>=13.2.0",
    "botocore>=1.35.0",
    "PyJWT>=2.10.0",
    "bcrypt>=4.2.0",
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "markdownify>=0.13.1",
    "aiosmtplib>=3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
